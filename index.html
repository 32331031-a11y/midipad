<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>5x5 作曲シーケンサー</title>
    <!-- Tone.jsライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
            /* スワイプ時の画面スクロールなどを完全に防ぐ */
            touch-action: none; 
            user-select: none;
            -webkit-user-select: none;
        }
        #pad-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            width: 95vw;
            max-width: 600px;
            aspect-ratio: 1 / 1;
        }
        .pad {
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.1s; /* なぞったときの反応を良くするため少し短く */
            opacity: 0.4;
            border: 3px solid transparent;
            text-align: center;
            padding: 5px;
            box-sizing: border-box;
        }
        .pad.selected {
            opacity: 1;
            transform: scale(1.05);
            border-color: white;
            box-shadow: 0 0 15px currentColor;
        }
        .pad:active {
            transform: scale(0.95);
        }
        
        .group-melody { background-color: #ff4757; color: white; }
        .group-rhythm { background-color: #ffa502; color: white; }
        .group-chord  { background-color: #2ed573; color: white; }
        .group-inst   { background-color: #1e90ff; color: white; }
        /* コントロール列は最初から明るくする */
        .group-ctrl   { background-color: #57606f; color: white; opacity: 1; } 
        
        .label {
            font-size: 10px;
            opacity: 0.8;
            margin-bottom: 4px;
        }
        #status {
            margin-top: 15px;
            font-size: 18px;
            height: 30px;
            color: #00ff88;
        }
    </style>
</head>
<body>

    <h2>Music Sequencer Pad</h2>
    <div id="pad-container"></div>
