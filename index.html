<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>おんがく まほうばこ - Toy Box Studio</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=M+PLUS+Rounded+1c:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }

        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'M PLUS Rounded 1c', 'Fredoka', sans-serif;
            background-color: #fef08a;
        }

        .app-container {
            display: flex;
            flex-direction: row;
            width: 100vw;
            height: 100vh;
            height: 100dvh;
            padding: 12px;
            gap: 12px;
        }

        .control-panel {
            width: 20%;
            min-width: 190px;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
            overflow-y: auto;
            -webkit-overflow-scrolling: touch;
            padding-right: 4px;
        }

        .pad-panel {
            width: 80%;
            flex: 1;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative; /* エフェクト用 */
        }

        .pad-grid-container {
            width: 100%;
            height: 100%;
            max-height: 100%;
            aspect-ratio: 1 / 1;
            background-color: #ffffff;
            padding: 16px;
            border-radius: 1.5rem;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
            border: 8px solid #fde047;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .pad-grid {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 8px;
            touch-action: none;
        }

        .pad {
            transition: all 0.1s ease-out;
            box-shadow: 0 6px 0 rgba(0,0,0,0.15), inset 0 4px 0 rgba(255,255,255,0.4);
            border-radius: 1.2rem;
            cursor: pointer;
        }
        
        .pad:active, .pad.active {
            transform: translateY(6px) scale(0.96);
            box-shadow: 0 0px 0 rgba(0,0,0,0.15), inset 0 2px 0 rgba(255,255,255,0.4);
            filter: brightness(1.2);
        }

        .btn-toy {
            box-shadow: 0 6px 0 rgba(0,0,0,0.2), inset 0 4px 0 rgba(255,255,255,0.3);
            transition: all 0.1s;
        }

        .btn-toy:active, .btn-toy.active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 rgba(0,0,0,0.2), inset 0 2px 0 rgba(255,255,255,0.3);
        }

        /* アニメーション中の録音ボタン点滅 */
        @keyframes pulse-red {
            0%, 100% { background-color: #ef4444; }
            50% { background-color: #fca5a5; }
        }
        .recording {
            animation: pulse-red 0.5s infinite;
        }

        /* フィニッシュエフェクト用 */
        .star-burst {
            position: absolute;
            font-size: 2rem;
            pointer-events: none;
            animation: explode 1s ease-out forwards;
            z-index: 50;
        }
        @keyframes explode {
            0% { transform: translate(0, 0) scale(0.5) rotate(0deg); opacity: 1; }
            100% { transform: translate(var(--tx), var(--ty)) scale(1.5) rotate(360deg); opacity: 0; }
        }

        .row-0 { background: #ef4444; border: 3px solid #b91c1c; }
        .row-1 { background: #f59e0b; border: 3px solid #b45309; }
        .row-2 { background: #eab308; border: 3px solid #a16207; }
        .row-3 { background: #10b981; border: 3px solid #047857; }
        .row-4 { background: #3b82f6; border: 3px solid #1d4ed8; }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 22px;
            width: 22px;
            border-radius: 50%;
            background: #ff5722;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
            border: 2px solid white;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 10px;
            cursor: pointer;
            background: #fde047;
            border-radius: 5px;
            border: 1px solid #eab308;
        }

        .rhythm-btn-card {
            box-shadow: 0 4px 0 rgba(0,0,0,0.15);
            transition: all 0.1s;
        }
        .rhythm-btn-card:active {
            transform: translateY(4px);
            box-shadow: none;
        }

        @media (max-width: 768px) and (orientation: portrait) {
            .app-container {
                flex-direction: column-reverse;
                padding: 8px;
            }
            .control-panel {
                width: 100%;
                min-width: 0;
                height: 40%;
            }
            .pad-panel {
                width: 100%;
                height: 60%;
            }
            .rhythm-grid {
                grid-template-columns: repeat(3, 1fr) !important;
            }
        }
    </style>
</head>
<body>

<div class="app-container">

    <!-- 左側：操作パネル -->
    <div class="control-panel">
        <h1 class="text-lg md:text-xl font-extrabold text-orange-600 tracking-wide flex items-center justify-center gap-1 py-1">
            🧸 まほうばこ
        </h1>

                <span>🎲</span>
                <span class="text-[10px]">おまかせ</span>
            </button>
            <button id="btn-record" class="btn-toy bg-red-500 hover:bg-red-400 text-white w-1/2 py-2 rounded-xl text-sm font-bold border-2 border-red-700 flex items-center justify-center flex-col shadow-md">
                <span>🎤</span>
                <span class="text-[10px]">ろくおん</span>

                <input type="range" id="ctrl-attack" min="0" max="1" step="0.01" value="0.05">
            </div>
            <div class="flex flex-col gap-0.5">
                <div class="flex justify-between items-center font-bold text-[10px] text-amber-900">

                    <span id="label-release-reverb" class="text-amber-900">すこし</span>
                </div>
                <input type="range" id="ctrl-release-reverb" min="0" max="1" step="0.01" value="0.2">
            </div>

                    <span>びよびよ</span>
                    <span id="label-biyobiyo" class="text-amber
