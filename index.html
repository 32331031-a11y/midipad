<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Generative Pad Synth</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            overflow-x: hidden;
            touch-action: manipulation; /* Prevent double-tap zoom */
        }

        /* Prevent scrolling when interacting with the grid on mobile */
        #pad-grid-container {
            touch-action: none;
        }

        .pad {
            transition: transform 0.05s ease, box-shadow 0.1s ease, background-color 0.1s ease;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.5), 0 4px 6px -1px rgba(0,0,0,0.3);
        }

        .pad.active {
            transform: scale(0.92);
            box-shadow: 0 0 20px currentColor, inset 0 0 5px rgba(255,255,255,0.5);
            filter: brightness(1.5);
        }

        /* Custom Slider Styling */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #38bdf8;
            cursor: pointer;
            margin-top: -6px;
            box-shadow: 0 0 5px #38bdf8;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #334155;
            border-radius: 2px;
        }
        input[type=range]:focus {
            outline: none;
        }

        /* Initialization Overlay */
        #init-overlay {
            backdrop-filter: blur(10px);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 md:p-8">

    <!-- Initialization Overlay (Required for Web Audio API Autoplay Policy) -->
    <div id="init-overlay" class="fixed inset-0 z-50 flex flex-col items-center justify-center bg-slate-900/80">
        <h1 class="text-4xl md:text-6xl font-bold mb-4 text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-indigo-500">
            Generative Pad
        </h1>
        <p class="text-slate-300 mb-8 text-center max-w-md px-4">
            5x5のインタラクティブな音楽ジェネレーター。<br>タップやスワイプで演奏できます。
        </p>
        <button id="start-btn" class="px-8 py-4 bg-sky-500 hover:bg-sky-400 text-white rounded-full font-bold text-xl shadow-[0_0_20px_rgba(14,165,233,0.5)] transition-all transform hover:scale-105">
            START 🎵
        </button>
    </div>

    <div class="w-full max-w-6xl flex flex-col lg:flex-row gap-8 opacity-0 transition-opacity duration-1000" id="main-app">
        
        <!-- Left Column: Pad Grid -->
        <div class="flex-1 flex flex-col items-center justify-center">
            <div id="pad-grid-container" class="grid grid-cols-5 grid-rows-5 gap-2 md:gap-3 w-full max-w-md aspect-square bg-slate-800 p-3 md:p-4 rounded-2xl shadow-2xl border border-slate-700">
                <!-- Pads will be injected by JS -->
            </div>
            
            <div class="mt-8 flex gap-2 w-full max-w-md">
                <button id="generate-btn" class="flex-1 py-3 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-400 hover:to-purple-500 rounded-xl font-bold text-white shadow-lg transition-all active:scale-95 flex items-center justify-center gap-2 text-sm md:text-base">
                    <svg class="w-5 h-5 hidden md:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"></path></svg>
                    Generate
                </button>
                <button id="auto-beat-btn" class="flex-1 py-3 bg-teal-600 hover:bg-teal-500 rounded-xl font-bold text-white shadow-lg transition-all active:scale-95 flex items-center justify-center gap-1 text-sm md:text-base" title="Auto Random Beat">
                    🎲 Auto Beat
                </button>
                <button id="toggle-rhythm-btn" class="w-12 h-12 md:w-14 md:h-14 bg-slate-700 hover:bg-slate-600 rounded-xl flex items-center justify-center transition-colors shadow-lg active:scale-95 flex-shrink-0" title="Toggle Rhythm Loop">
                    🥁
                </button>
            </div>
            
            <div class="mt-4 w-full max-w-md">
                <button id="open-popup-btn" class="w-full py-3 bg-slate-700 hover:bg-slate-600 rounded-xl font-bold text-sky-400 border border-slate-600 shadow-lg transition-all active:scale-95 flex items-center justify-center gap-2">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"></path></svg>
                    別ウィンドウでパッドを開く
                </button>
            </div>
        </div>

        <!-- Right Column: Synth Controls -->
        <div class="flex-1 bg-slate-800/50 p-6 rounded-2xl border border-slate-700 backdrop-blur-sm flex flex-col gap-6">
            <div>
                <h2 class="text-2xl font-bold text-sky-400 mb-1 flex justify-between items-end">
                    <span>Synthesizer</span>
                    <span id="current-scale-label" class="text-sm font-normal text-slate-400 bg-slate-900 px-2 py-1 rounded">C Minor Pentatonic</span>
                </h2>
                <p class="text-xs text-slate-400 mb-4">Current parameters. Auto-updated upon generation.</p>
            </div>

            <!-- Waveform Selector -->
            <div class="space-y-2">
                <label class="text-sm font-semibold text-slate-300">Oscillator Waveform</label>
                <div class="flex gap-2 bg-slate-900 p-1 rounded-lg">
                    <button class="wave-btn flex-1 py-1 text-xs rounded bg-slate-700 text-white" data-wave="sine">Sine</button>
                    <button class="wave-btn flex-1 py-1 text-xs rounded hover:bg-slate-800 text-slate-400" data-wave="square">Square</button>
                    <button class="wave-btn flex-1 py-1 text-xs rounded hover:bg-slate-800 text-slate-400" data-wave="sawtooth">Saw</button>
                    <button class="wave-btn flex-1 py-1 text-xs rounded hover:bg-slate-800 text-slate-400" data-wave="triangle">Tri</button>
                </div>
            </div>

            <!-- ADSR Envelope -->
            <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-700/50 space-y-3">
                <h3 class="text-sm font-semibold text-indigo-400">ADSR Envelope</h3>
                <div class="grid grid-cols-2 gap-4">
                    <div class="flex flex-col gap-1">
                        <label class="text-xs text-slate-400 flex justify-between">Attack <span id="val-attack">0.1s</span></label>
                        <input type="range" id="ctrl-attack" min="0.01" max="2" step="0.01" value="0.1">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-xs text-slate-400 flex justify-between">Decay <span id="val-decay">0.2s</span></label>
                        <input type="range" id="ctrl-decay" min="0.01" max="2" step="0.01" value="0.2">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-xs text-slate-400 flex justify-between">Sustain <span id="val-sustain">0.5</span></label>
                        <input type="range" id="ctrl-sustain" min="0" max="1" step="0.01" value="0.5">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-xs text-slate-400 flex justify-between">Release <span id="val-release">1.0s</span></label>
                        <input type="range" id="ctrl-release" min="0.01" max="5" step="0.01" value="1.0">
                    </div>
                </div>
            </div>

            <!-- Filter -->
            <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-700/50 space-y-3">
                <h3 class="text-sm font-semibold text-emerald-400">Lowpass Filter</h3>
                <div class="grid grid-cols-2 gap-4">
                    <div class="flex flex-col gap-1">
                        <label class="text-xs text-slate-400 flex justify-between">Cutoff <span id="val-cutoff">2000Hz</span></label>
                        <input type="range" id="ctrl-cutoff" min="100" max="10000" step="10" value="2000">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-xs text-slate-400 flex justify-between">Resonance <span id="val-res">5</span></label>
                        <input type="range" id="ctrl-res" min="0" max="20" step="0.1" value="5">
                    </div>
                </div>
            </div>

            <!-- Effects (Delay & Reverb) -->
            <div class="bg-slate-900/50 p-4 rounded-xl border border-slate-700/50 space-y-3">
                <h3 class="text-sm font-semibold text-pink-400">Effects (Delay & Reverb)</h3>
                <div class="grid grid-cols-2 gap-4">
                    <div class="flex flex-col gap-1">
                        <label class="text-xs text-slate-400 flex justify-between">Delay Time <span id="val-delay-time">0.3s</span></label>
                        <input type="range" id="ctrl-delay-time" min="0.05" max="1" step="0.05" value="0.3">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-xs text-slate-400 flex justify-between">Feedback <span id="val-delay-fb">0.4</span></label>
                        <input type="range" id="ctrl-delay-fb" min="0" max="0.9" step="0.01" value="0.4">
                    </div>
                    <div class="flex flex-col gap-1 col-span-2 mt-2">
                        <label class="text-xs text-slate-400 flex justify-between">Reverb Mix <span id="val-reverb">0.3</span></label>
                        <input type="range" id="ctrl-reverb" min="0" max="1" step="0.01" value="0.3">
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script>
        // === Core State & Variables ===
        var audioCtx;
        let masterGain, delayNode, feedbackGain, reverbNode, dryGain, wetGain;
        var padFrequencies = [];
        let isPointerDown = false;
        let lastTriggeredIndex = -1;
        let rhythmInterval = null;
        let isRhythmPlaying = false;
        let autoBeatInterval = null;
        let isAutoBeatPlaying = false;
        var popupPadWin = null;

        // Visual Colors for Pads
        const padColors = [
            '#ef4444', '#f97316', '#eab308', '#22c55e', '#0ea5e9', 
            '#6366f1', '#a855f7', '#ec4899', '#f43f5e', '#14b8a6'
        ];
        var currentPadColor = '#0ea5e9';

        // Synth Parameters State
        const params = {
            waveform: 'sine',
            attack: 0.1,
            decay: 0.2,
            sustain: 0.5,
            release: 1.0,
            cutoff: 2000,
            resonance: 5,
            delayTime: 0.3,
            delayFeedback: 0.4,
            reverbMix: 0.3,
            baseNote: 48 // C3
        };

        // Musical Scales (Intervals from Root)
        const scales = {
            'Minor Pentatonic': [0, 3, 5, 7, 10],
            'Major Pentatonic': [0, 2, 4, 7, 9]
        };
        const noteNames = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

        // === Initialization & UI Setup ===
        const initBtn = document.getElementById('start-btn');
        const overlay = document.getElementById('init-overlay');
        const mainApp = document.getElementById('main-app');
        const gridContainer = document.getElementById('pad-grid-container');

        initBtn.addEventListener('click', async () => {
            await initAudio();
            generateScale(); // Initialize initial scale
            updateUIFromParams();
            
            overlay.classList.add('opacity-0');
            setTimeout(() => {
                overlay.style.display = 'none';
                mainApp.classList.remove('opacity-0');
            }, 500);
        });

        function createPads() {
            for (let i = 0; i < 25; i++) {
                const pad = document.createElement('div');
                pad.classList.add('pad', 'rounded-xl', 'cursor-pointer', 'bg-slate-700');
                pad.dataset.index = i;
                
                // Mouse Events
                pad.addEventListener('mousedown', (e) => handlePadTrigger(i, pad));
                pad.addEventListener('mouseenter', (e) => {
                    if (isPointerDown) handlePadTrigger(i, pad);
                });
                
                gridContainer.appendChild(pad);
            }

            // Global Pointer state
            document.addEventListener('mousedown', () => isPointerDown = true);
            document.addEventListener('mouseup', () => {
                isPointerDown = false;
                lastTriggeredIndex = -1;
            });
            document.addEventListener('mouseleave', () => {
                isPointerDown = false;
                lastTriggeredIndex = -1;
            });

            // Touch Events for Mobile Swiping
            gridContainer.addEventListener('touchstart', (e) => {
                isPointerDown = true;
                handleTouchMove(e);
            }, { passive: false });
            
            gridContainer.addEventListener('touchmove', handleTouchMove, { passive: false });
            
            gridContainer.addEventListener('touchend', () => {
                isPointerDown = false;
                lastTriggeredIndex = -1;
            });
        }

        function handleTouchMove(e) {
            e.preventDefault(); // Prevent scrolling
            if (!isPointerDown) return;
            const touch = e.touches[0];
            const element = document.elementFromPoint(touch.clientX, touch.clientY);
            
            if (element && element.classList.contains('pad')) {
                const index = parseInt(element.dataset.index);
                if (index !== lastTriggeredIndex) {
                    handlePadTrigger(index, element);
                    lastTriggeredIndex = index;
                }
            }
        }

        function handlePadTrigger(index, element) {
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const freq = padFrequencies[index];
            playNote(freq);
            
            // Visual feedback
            element.style.color = currentPadColor;
            element.classList.add('active');
            setTimeout(() => {
                element.classList.remove('active');
                element.style.color = '';
            }, 200);
        }

        // === Audio Engine ===
        async function initAudio() {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            
            // Master Chain
            masterGain = audioCtx.createGain();
            masterGain.gain.value = 0.8;
            
            // Effects Chain
            delayNode = audioCtx.createDelay(2.0);
            feedbackGain = audioCtx.createGain();
            
            // Reverb Matrix
            reverbNode = audioCtx.createConvolver();
            reverbNode.buffer = createReverbBuffer(2.5, 2.0);
            
            dryGain = audioCtx.createGain();
            wetGain = audioCtx.createGain();

            // Routing
            // Main -> Dry -> Master
            // Main -> Delay -> Feedback -> Delay
            // Main -> Delay -> Master
            // Main -> Reverb -> Wet -> Master

            delayNode.connect(feedbackGain);
            feedbackGain.connect(delayNode);
            delayNode.connect(masterGain);
            
            reverbNode.connect(wetGain);
            wetGain.connect(masterGain);
            
            dryGain.connect(masterGain);
            masterGain.connect(audioCtx.destination);

            updateEffectsNodes();
        }

        function createReverbBuffer(duration, decay) {
            const sampleRate = audioCtx.sampleRate;
            const length = sampleRate * duration;
            const impulse = audioCtx.createBuffer(2, length, sampleRate);
            const left = impulse.getChannelData(0);
            const right = impulse.getChannelData(1);
            
            for (let i = 0; i < length; i++) {
                const n = i === 0 ? 0 : i;
                left[i] = (Math.random() * 2 - 1) * Math.pow(1 - n / length, decay);
                right[i] = (Math.random() * 2 - 1) * Math.pow(1 - n / length, decay);
            }
            return impulse;
        }

        function playNote(frequency) {
            const time = audioCtx.currentTime;
            
            const osc = audioCtx.createOscillator();
            const filter = audioCtx.createBiquadFilter();
            const vca = audioCtx.createGain();

            osc.type = params.waveform;
            osc.frequency.setValueAtTime(frequency, time);

            // Filter settings
            filter.type = 'lowpass';
            // Slight filter envelope based on attack/decay
            filter.frequency.setValueAtTime(Math.max(100, params.cutoff / 4), time);
            filter.frequency.exponentialRampToValueAtTime(params.cutoff, time + params.attack);
            filter.frequency.exponentialRampToValueAtTime(Math.max(100, params.cutoff * 0.7), time + params.attack + params.decay);
            filter.Q.value = params.resonance;

            // ADSR Amplitude Envelope
            vca.gain.setValueAtTime(0, time);
            vca.gain.linearRampToValueAtTime(1, time + params.attack);
            vca.gain.exponentialRampToValueAtTime(Math.max(0.01, params.sustain), time + params.attack + params.decay);
            vca.gain.setValueAtTime(Math.max(0.01, params.sustain), time + params.attack + params.decay + 0.1); // hold
            vca.gain.exponentialRampToValueAtTime(0.001, time + params.attack + params.decay + params.release + 0.1);

            // Connections
            osc.connect(filter);
            filter.connect(vca);
            
            // Route to effects
            vca.connect(dryGain);
            vca.connect(delayNode);
            vca.connect(reverbNode);

            // Play & Cleanup
            osc.start(time);
            const stopTime = time + params.attack + params.decay + params.release + 0.2;
            osc.stop(stopTime);
            
            setTimeout(() => {
                osc.disconnect();
                filter.disconnect();
                vca.disconnect();
            }, (stopTime - time) * 1000 + 1000);
        }

        function playKickDrum() {
            if(!audioCtx) return;
            const time = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(150, time);
            osc.frequency.exponentialRampToValueAtTime(0.001, time + 0.5);
            
            gain.gain.setValueAtTime(1, time);
            gain.gain.exponentialRampToValueAtTime(0.001, time + 0.5);
            
            osc.connect(gain);
            // Connect to master directly, bypassing reverb/delay for tight punch
            gain.connect(masterGain); 
            
            osc.start(time);
            osc.stop(time + 0.5);
        }

        // === Generative Logic ===
        function midiToFreq(m) {
            return 440 * Math.pow(2, (m - 69) / 12);
        }

        function generateScale() {
            // Random root note (C2 to B3)
            params.baseNote = 36 + Math.floor(Math.random() * 24);
            
            // Random scale type
            const scaleKeys = Object.keys(scales);
            const scaleName = scaleKeys[Math.floor(Math.random() * scaleKeys.length)];
            const scaleIntervals = scales[scaleName];
            
            padFrequencies = [];
            let currentOctave = 0;
            
            for (let i = 0; i < 25; i++) {
                const intervalIndex = i % scaleIntervals.length;
                if (i > 0 && intervalIndex === 0) currentOctave++;
                
                const midiNote = params.baseNote + scaleIntervals[intervalIndex] + (currentOctave * 12);
                padFrequencies.push(midiToFreq(midiNote));
            }

            // Update Label
            const noteName = noteNames[params.baseNote % 12];
            document.getElementById('current-scale-label').textContent = `${noteName} ${scaleName}`;
        }

        function randomizeParameters() {
            const waves = ['sine', 'square', 'sawtooth', 'triangle'];
            params.waveform = waves[Math.floor(Math.random() * waves.length)];
            
            // Random ADSR (favoring usable musical envelopes)
            params.attack = Math.random() < 0.5 ? (Math.random() * 0.1) : (Math.random() * 0.8 + 0.1);
            params.decay = Math.random() * 0.5 + 0.1;
            params.sustain = Math.random() * 0.8;
            params.release = Math.random() * 2 + 0.1;
            
            // Random Filter
            params.cutoff = Math.random() * 8000 + 500;
            params.resonance = Math.random() * 15;
            
            // Random Effects
            // Try to make delay musically timed based on a BPM between 80 and 140
            const bpm = 80 + Math.random() * 60;
            const quarterNote = 60 / bpm;
            const delayMultipliers = [0.25, 0.5, 0.75, 1.0];
            
            params.delayTime = quarterNote * delayMultipliers[Math.floor(Math.random() * delayMultipliers.length)];
            params.delayFeedback = Math.random() * 0.6 + 0.1; // keep it safe from feedback loops
            params.reverbMix = Math.random() * 0.6;

            // Random Color
            currentPadColor = padColors[Math.floor(Math.random() * padColors.length)];

            generateScale();
            updateUIFromParams();
            updateEffectsNodes();
            
            // Rhythmic pulse visual on grid
            gridContainer.style.borderColor = currentPadColor;
            gridContainer.style.boxShadow = `0 0 20px ${currentPadColor}40`;

            // Update Popup Window if open
            if (popupPadWin && !popupPadWin.closed && popupPadWin.updateGridColor) {
                popupPadWin.updateGridColor(currentPadColor);
            }
        }

        function updateEffectsNodes() {
            if(!audioCtx) return;
            delayNode.delayTime.value = params.delayTime;
            feedbackGain.gain.value = params.delayFeedback;
            
            wetGain.gain.value = params.reverbMix;
            dryGain.gain.value = 1 - (params.reverbMix * 0.5); // compensate
        }

        function updateUIFromParams() {
            // Update Waveform Buttons
            document.querySelectorAll('.wave-btn').forEach(btn => {
                if (btn.dataset.wave === params.waveform) {
                    btn.classList.replace('bg-transparent', 'bg-slate-700');
                    btn.classList.replace('text-slate-400', 'text-white');
                    btn.style.backgroundColor = currentPadColor;
                } else {
                    btn.style.backgroundColor = '';
                    btn.classList.replace('bg-slate-700', 'bg-transparent');
                    btn.classList.replace('text-white', 'text-slate-400');
                }
            });

            // Update Sliders and Labels
            const map = {
                'attack': { id: 'attack', val: params.attack, unit: 's', fix: 2 },
                'decay': { id: 'decay', val: params.decay, unit: 's', fix: 2 },
                'sustain': { id: 'sustain', val: params.sustain, unit: '', fix: 2 },
                'release': { id: 'release', val: params.release, unit: 's', fix: 2 },
                'cutoff': { id: 'cutoff', val: params.cutoff, unit: 'Hz', fix: 0 },
                'res': { id: 'res', val: params.resonance, unit: '', fix: 1 },
                'delay-time': { id: 'delay-time', val: params.delayTime, unit: 's', fix: 2 },
                'delay-fb': { id: 'delay-fb', val: params.delayFeedback, unit: '', fix: 2 },
                'reverb': { id: 'reverb', val: params.reverbMix, unit: '', fix: 2 }
            };

            for (const key in map) {
                const el = document.getElementById(`ctrl-${map[key].id}`);
                const lbl = document.getElementById(`val-${map[key].id}`);
                if(el && lbl) {
                    el.value = map[key].val;
                    lbl.textContent = map[key].val.toFixed(map[key].fix) + map[key].unit;
                }
            }
        }

        // === Event Listeners for UI Controls ===
        document.getElementById('generate-btn').addEventListener('click', () => {
            randomizeParameters();
            
            // Visual bump
            const btn = document.getElementById('generate-btn');
            btn.classList.add('scale-95');
            setTimeout(() => btn.classList.remove('scale-95'), 150);
        });

        document.getElementById('toggle-rhythm-btn').addEventListener('click', (e) => {
            isRhythmPlaying = !isRhythmPlaying;
            const btn = e.currentTarget;
            if(isRhythmPlaying) {
                btn.classList.replace('bg-slate-700', 'bg-sky-600');
                // Calculate ms from delayTime to sync rhythm
                const intervalTime = params.delayTime * 1000 * 2; // e.g. half notes based on delay
                rhythmInterval = setInterval(() => {
                    playKickDrum();
                    // flash grid slightly
                    gridContainer.classList.add('brightness-125');
                    setTimeout(() => gridContainer.classList.remove('brightness-125'), 100);
                }, intervalTime);
                playKickDrum(); // Play first beat immediately
            } else {
                btn.classList.replace('bg-sky-600', 'bg-slate-700');
                clearInterval(rhythmInterval);
            }
        });

        // === Auto Beat Logic ===
        function triggerRandomPad() {
            if (!audioCtx || audioCtx.state === 'suspended') return;
            const randomIndex = Math.floor(Math.random() * 25);
            const freq = padFrequencies[randomIndex];
            playNote(freq);
            
            // Visual trigger on main grid
            const padEl = document.querySelector(`.pad[data-index="${randomIndex}"]`);
            if(padEl) {
                padEl.style.color = currentPadColor;
                padEl.classList.add('active');
                setTimeout(() => {
                    padEl.classList.remove('active');
                    padEl.style.color = '';
                }, 150);
            }
            
            // Visual trigger on popup window if it exists
            if (popupPadWin && !popupPadWin.closed) {
                const popPad = popupPadWin.document.querySelector(`.pad[data-index="${randomIndex}"]`);
                if (popPad) {
                    popPad.style.color = currentPadColor;
                    popPad.classList.add('active');
                    setTimeout(() => {
                        popPad.classList.remove('active');
                        popPad.style.color = '';
                    }, 150);
                }
            }
        }

        document.getElementById('auto-beat-btn').addEventListener('click', (e) => {
            if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
            isAutoBeatPlaying = !isAutoBeatPlaying;
            const btn = e.currentTarget;
            
            if(isAutoBeatPlaying) {
                btn.classList.replace('bg-teal-600', 'bg-teal-400');
                btn.classList.add('shadow-[0_0_15px_rgba(45,212,191,0.6)]');
                
                // Set sequence interval (e.g. 16th or 8th notes based on delay time for sync)
                const intervalTime = (params.delayTime * 1000) / 2;
                
                autoBeatInterval = setInterval(() => {
                    // 60% probability to play a random pad note
                    if (Math.random() < 0.6) {
                        triggerRandomPad();
                    }
                    // 20% probability to add an extra syncopated kick drum
                    if (Math.random() < 0.2) {
                        playKickDrum();
                    }
                }, intervalTime);
            } else {
                btn.classList.replace('bg-teal-400', 'bg-teal-600');
                btn.classList.remove('shadow-[0_0_15px_rgba(45,212,191,0.6)]');
                clearInterval(autoBeatInterval);
            }
        });

        // === Popup Window Logic ===
        document.getElementById('open-popup-btn').addEventListener('click', () => {
            popupPadWin = window.open('', 'GenerativePads', 'width=500,height=500,menubar=no,toolbar=no');
            if(!popupPadWin) {
                alert("ポップアップがブロックされました。ブラウザの設定で許可してください。");
                return;
            }
            
            const html = `
                <!DOCTYPE html>
                <html lang="ja">
                <head>
                    <meta charset="UTF-8">
                    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
                    <title>Generative Pad</title>
                    <style>
                        body { 
                            background-color: #0f172a; 
                            touch-action: manipulation; 
                            display: flex; 
                            justify-content: center; 
                            align-items: center; 
                            min-height: 100vh; 
                            margin: 0; 
                        }
                        #pad-grid-container { 
                            touch-action: none; 
                            width: 100%; 
                            max-width: 450px; 
                            aspect-ratio: 1/1; 
                            display: grid; 
                            grid-template-columns: repeat(5, 1fr); 
                            grid-template-rows: repeat(5, 1fr); 
                            gap: 12px; 
                            background: #1e293b; 
                            padding: 16px; 
                            border-radius: 1rem; 
                            border: 1px solid #334155;
                        }
                        .pad { 
                            transition: transform 0.05s ease, box-shadow 0.1s ease, background-color 0.1s ease; 
                            box-shadow: inset 0 0 10px rgba(0,0,0,0.5), 0 4px 6px -1px rgba(0,0,0,0.3); 
                            border-radius: 0.75rem; 
                            cursor: pointer; 
                            background-color: #334155; 
                        }
                        .pad.active { 
                            transform: scale(0.92); 
                            box-shadow: 0 0 20px currentColor, inset 0 0 5px rgba(255,255,255,0.5); 
                            filter: brightness(1.5); 
                        }
                    </style>
                </head>
                <body>
                    <div id="pad-grid-container"></div>
                    <script>
                        const container = document.getElementById('pad-grid-container');
                        let isPointerDown = false;
                        let lastTriggeredIndex = -1;

                        // Create Pads
                        for (let i = 0; i < 25; i++) {
                            const pad = document.createElement('div');
                            pad.classList.add('pad');
                            pad.dataset.index = i;
                            
                            pad.addEventListener('mousedown', () => triggerPad(i, pad));
                            pad.addEventListener('mouseenter', () => { if(isPointerDown) triggerPad(i, pad); });
                            container.appendChild(pad);
                        }

                        // Pointer Events
                        document.addEventListener('mousedown', () => isPointerDown = true);
                        document.addEventListener('mouseup', () => { isPointerDown = false; lastTriggeredIndex = -1; });
                        document.addEventListener('mouseleave', () => { isPointerDown = false; lastTriggeredIndex = -1; });

                        // Touch Events for Mobile Swiping
                        container.addEventListener('touchstart', (e) => { 
                            isPointerDown = true; 
                            handleTouchMove(e); 
                        }, { passive: false });
                        container.addEventListener('touchmove', handleTouchMove, { passive: false });
                        container.addEventListener('touchend', () => { 
                            isPointerDown = false; 
                            lastTriggeredIndex = -1; 
                        });

                        function handleTouchMove(e) {
                            e.preventDefault(); // Prevent scrolling
                            if (!isPointerDown) return;
                            const touch = e.touches[0];
                            const element = document.elementFromPoint(touch.clientX, touch.clientY);
                            if (element && element.classList.contains('pad')) {
                                const index = parseInt(element.dataset.index);
                                if (index !== lastTriggeredIndex) {
                                    triggerPad(index, element);
                                    lastTriggeredIndex = index;
                                }
                            }
                        }

                        function triggerPad(index, element) {
                            if(window.opener && !window.opener.closed) {
                                const openerCtx = window.opener.audioCtx;
                                if(openerCtx && openerCtx.state === 'suspended') openerCtx.resume();
                                
                                // Play note on main window
                                const freq = window.opener.padFrequencies[index];
                                window.opener.playNote(freq);
                                
                                // Visual feedback
                                const color = window.opener.currentPadColor;
                                element.style.color = color;
                                element.classList.add('active');
                                setTimeout(() => {
                                    element.classList.remove('active');
                                    element.style.color = '';
                                }, 200);
                            }
                        }
                        
                        // Exposed function to allow main window to sync colors
                        window.updateGridColor = function(color) {
                            container.style.borderColor = color;
                            container.style.boxShadow = "0 0 20px " + color + "40";
                        };
                    <\/script>
                </body>
                </html>
            `;
            popupPadWin.document.open();
            popupPadWin.document.write(html);
            popupPadWin.document.close();
            
            // Sync initial color
            popupPadWin.onload = () => {
                if(window.currentPadColor) {
                    popupPadWin.updateGridColor(window.currentPadColor);
                }
            };
        });

        // Waveform selection
        document.querySelectorAll('.wave-btn').forEach(btn => {
            btn.addEventListener('click', (e) => {
                params.waveform = e.target.dataset.wave;
                updateUIFromParams();
            });
        });

        // Generic binding for all sliders
        const sliderBindings = {
            'ctrl-attack': { key: 'attack', lbl: 'val-attack', unit: 's' },
            'ctrl-decay': { key: 'decay', lbl: 'val-decay', unit: 's' },
            'ctrl-sustain': { key: 'sustain', lbl: 'val-sustain', unit: '' },
            'ctrl-release': { key: 'release', lbl: 'val-release', unit: 's' },
            'ctrl-cutoff': { key: 'cutoff', lbl: 'val-cutoff', unit: 'Hz' },
            'ctrl-res': { key: 'resonance', lbl: 'val-res', unit: '' },
            'ctrl-delay-time': { key: 'delayTime', lbl: 'val-delay-time', unit: 's', effectUpdate: true },
            'ctrl-delay-fb': { key: 'delayFeedback', lbl: 'val-delay-fb', unit: '', effectUpdate: true },
            'ctrl-reverb': { key: 'reverbMix', lbl: 'val-reverb', unit: '', effectUpdate: true }
        };

        for (const [id, config] of Object.entries(sliderBindings)) {
            const el = document.getElementById(id);
            el.addEventListener('input', (e) => {
                const val = parseFloat(e.target.value);
                params[config.key] = val;
                
                // Update label dynamically
                let displayVal = val;
                if(config.unit === 'Hz') displayVal = val.toFixed(0);
                else displayVal = val.toFixed(2);
                document.getElementById(config.lbl).textContent = displayVal + config.unit;

                if (config.effectUpdate) {
                    updateEffectsNodes();
                }
            });
        }

        // Initialize DOM
        createPads();
    </script>
</body>
</html>
