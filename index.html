<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>5x5 作曲シーケンサー</title>
    <!-- Tone.jsライブラリ -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <style>
        body {
            background-color: #1a1a1a;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
            touch-action: none; /* 全体のスワイプ更新などを防止 */
            user-select: none;
            -webkit-user-select: none;
        }
        
        h2 {
            margin: 10px 0;
            font-size: 20px;
        }

        /* 5x5のグリッドコンテナ */
        #pad-container {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            grid-template-rows: repeat(5, 1fr);
            gap: 8px;
            width: 95vw;
            height: 95vw;
            max-width: 500px;
            max-height: 500px;
            touch-action: none; /* コンテナ内のスクロールを無効化し、なぞりを優先 */
            background-color: #2a2a2a;
            padding: 10px;
            border-radius: 12px;
            box-sizing: border-box;
        }

        .pad {
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: bold;
            cursor: pointer;
            opacity: 0.3;
            border: 2px solid transparent;
            text-align: center;
            box-sizing: border-box;
            transition: transform 0.1s, opacity 0.1s;
        }

        .pad.selected {
            opacity: 1;
            transform: scale(1.05);
            border-color: white;
            box-shadow: 0 0 10px currentColor;
            z-index: 2;
        }

        .pad:active {
            transform: scale(0.95);
        }
        
        /* 各行のテーマカラー */
        .group-melody { background-color: #ff4757; color: white; }
        .group-rhythm { background-color: #ffa502; color: white; }
        .group-chord  { background-color: #2ed573; color: white; }
        .group-inst   { background-color: #1e90ff; color: white; }
        .group-ctrl   { background-color: #57606f; color: white; opacity: 1; } 
        
        .label {
            font-size: 10px;
            opacity: 0.8;
            margin-bottom: 2px;
        }

        #status {
            margin-top: 15px;
            font-size: 14px;
            height: 30px;
            color: #00ff88;
        }
    </style>
</head>
<body>

    <h2>Music Sequencer</h2>
    <div id="pad-container"></div>
    <div id="status">準備完了：なぞって選んで再生！</div>

    <script>
        // エラーで止まらないようにtry-catchで全体を囲む
        try {
            const options = {
                melody: [
                    { name: "ドレミ", notes: ["C4", "E4", null, "G4", "B4", "C5", null, "G4"] },
                    { name: "せつない", notes: ["A3", "C4", "E4", null, "G4", "A4", "E4", null] },
                    { name: "和風", notes: ["C4", null, "D4", "F4", "G4", "A4", null, "F4"] },
                    { name: "明るい", notes: ["F4", "A4", "C5", null, "D5", "C5", "A4", null] },
                    { name: "アルペジオ", notes: ["C4", "E4", "G4", "C5", "G4", "E4", "C4", null] }
                ],
                rhythm: [
                    { name: "ゆったり", val: "4n" },
                    { name: "ふつう", val: "8n" },
                    { name: "はやい", val: "16n" },
                    { name: "スキップ", val: "8t" },
                    { name: "シャッフル", val: ["16n", "8n"] } 
                ],
                chord: [
                    { name: "ポップ", progressions: [["C4","E4","G4"], ["G3","B3","D4"], ["A3","C4","E4"], ["F3","A3","C4"]] }, 
                    { name: "アニメ", progressions: [["F3","A3","C4"], ["G3","B3","D4"], ["E3","G3","B3"], ["A3","C4","E4"]] }, 
                    { name: "おしゃれ", progressions: [["D3","F3","A3"], ["G3","B3","D4"], ["C4","E4","G4"], ["A3","C4","E4"]] }, 
                    { name: "ダーク", progressions: [["A3","C4","E4"], ["F3","A3","C4"], ["D3","F3","A3"], ["E3","G#3","B3"]] }, 
                    { name: "シンプル", progressions: [["C4","E4","G4"], ["F3","A3","C4"], ["C4","E4","G4"], ["G3","B3","D4"]] }  
                ],
                instrument: [
                    { name: "ピコピコ", val: "Synth" },
                    { name: "金属音", val: "FMSynth" },
                    { name: "やわらか", val: "AMSynth" },
                    { name: "ベース", val: "MembraneSynth" },
                    { name: "ノイズ", val: "PluckSynth" }
                ]
            };

            const state = { melody: 0, rhythm: 0, chord: 0, instrument: 0 };
            let melodySynth = null;
            let chordSynth = null;
            let currentSequence = null;

            const container = document.getElementById('pad-container');
            container.innerHTML = ''; // 中身を一度クリア

            const rows = [
                { type: 'melody', label: 'メロディ', class: 'group-melody', data: options.melody },
                { type: 'rhythm', label: 'リズム', class: 'group-rhythm', data: options.rhythm },
                { type: 'chord',  label: 'コード', class: 'group-chord', data: options.chord },
                { type: 'inst',   label: '楽器', class: 'group-inst', data: options.instrument }
            ];

            // --- 1〜4行目（パッド）の生成 ---
            rows.forEach((rowConfig) => {
                rowConfig.data.forEach((item, colIndex) => {
                    const pad = document.createElement('div');
                    pad.className = `pad ${rowConfig.class}`;
                    pad.id = `${rowConfig.type}-${colIndex}`;
                    
                    // なぞり判定用のデータ
                    pad.dataset.type = rowConfig.type;
                    pad.dataset.index = colIndex;

                    if (colIndex === 0) pad.classList.add('selected');
                    
                    pad.innerHTML = `<div class="label">${rowConfig.label}</div><div>${item.name}</div>`;
                    container.appendChild(pad);
                });
            });

            // --- 5行目（コントロール）の生成 ---
            const controls = [
                { name: "▶ 再生", action: playMusic },
                { name: "■ 停止", action: stopMusic },
                { name: "🎲 おまかせ", action: randomSelect },
                { name: "🐢 遅く", action: () => changeTempo(-10) },
                { name: "🐇 速く", action: () => changeTempo(10) }
            ];

            controls.forEach((ctrl) => {
                const pad = document.createElement('div');
                pad.className = 'pad group-ctrl';
                pad.textContent = ctrl.name;
                
                pad.addEventListener('click', async () => {
                    if (typeof Tone === 'undefined') {
                        updateStatus("Tone.jsの読み込みに失敗しています");
                        return;
                    }
                    await Tone.start();
                    ctrl.action();
                });
                container.appendChild(pad);
            });

            // --- なぞり操作（Pointer Events） ---
            let isDragging = false;

            function handlePointerEnter(element) {
                if (!element) return;
                const type = element.dataset.type;
                const indexStr = element.dataset.index;
                if (type && indexStr !== undefined) {
                    selectPad(type, parseInt(indexStr, 10));
                }
            }

            // 画面を押したとき
            document.addEventListener('pointerdown', (e) => {
                isDragging = true;
                const el = document.elementFromPoint(e.clientX, e.clientY);
                if (el) handlePointerEnter(el.closest('.pad'));
            });

            // 指を離したとき
            document.addEventListener('pointerup', () => isDragging = false);
            document.addEventListener('pointercancel', () => isDragging = false);

            // なぞっているとき
            document.addEventListener('pointermove', (e) => {
                if (isDragging) {
                    const el = document.elementFromPoint(e.clientX, e.clientY);
                    if (el) handlePointerEnter(el.closest('.pad'));
                }
            });

            // スマホのスクロール防止
            container.addEventListener('touchmove', (e) => {
                e.preventDefault();
            }, { passive: false });


            // --- 音楽制御ロジック ---
            function selectPad(type, index) {
                const stateKey = type === 'inst' ? 'instrument' : type;
                if (state[stateKey] === index) return;
                
                state[stateKey] = index;
                // 古い選択を解除
                for (let i = 0; i < 5; i++) {
                    const targetPad = document.getElementById(`${type}-${i}`);
                    if(targetPad) targetPad.classList.remove('selected');
                }
                // 新しい選択をハイライト
                const selectedPad = document.getElementById(`${type}-${index}`);
                if(selectedPad) selectedPad.classList.add('selected');
            }

            function updateStatus(text) {
                const statusEl = document.getElementById('status');
                if (statusEl) statusEl.textContent = text;
            }

            function changeTempo(amount) {
                if (typeof Tone !== 'undefined') {
                    Tone.Transport.bpm.value += amount;
                    updateStatus(`テンポ: ${Math.round(Tone.Transport.bpm.value)}`);
                }
            }

            function randomSelect() {
                selectPad('melody', Math.floor(Math.random() * 5));
                selectPad('rhythm', Math.floor(Math.random() * 5));
                selectPad('chord', Math.floor(Math.random() * 5));
                selectPad('inst', Math.floor(Math.random() * 5));
                updateStatus("ランダムに組み合わせました！");
            }

            function playMusic() {
                stopMusic(); 

                const selMelody = options.melody[state.melody].notes;
                const selRhythm = options.rhythm[state.rhythm].val;
                const selChordProg = options.chord[state.chord].progressions; 
                const selInst = options.instrument[state.instrument].val;

                const SynthType = Tone[selInst] || Tone.Synth;
                melodySynth = new Tone.PolySynth(SynthType).toDestination();
                chordSynth = new Tone.PolySynth(Tone.AMSynth, { volume: -12 }).toDestination();

                let chordIndex = 0;
                Tone.Transport.scheduleRepeat((time) => {
                    const currentChord = selChordProg[chordIndex % selChordProg.length];
                    chordSynth.triggerAttackRelease(currentChord, "2n", time);
                    chordIndex++;
                }, "1m"); 

                currentSequence = new Tone.Sequence((time, note) => {
                    if (note !== null) { 
                        const dur = Array.isArray(selRhythm) ? selRhythm[Math.floor(Math.random() * selRhythm.length)] : selRhythm;
                        melodySynth.triggerAttackRelease(note, dur, time);
                    }
                }, selMelody, typeof selRhythm === 'string' ? selRhythm : "8n").start(Tone.now());

                Tone.Transport.bpm.value = 120;
                Tone.Transport.start();
                updateStatus("🎶 再生中...");
            }

            function stopMusic() {
                if (typeof Tone !== 'undefined') {
                    Tone.Transport.stop();
                    Tone.Transport.cancel(0); 
                }
                if (currentSequence) { currentSequence.dispose(); currentSequence = null; }
                if (melodySynth) { melodySynth.dispose(); melodySynth = null; }
                if (chordSynth) { chordSynth.dispose(); chordSynth = null; }
                updateStatus("⏹ 停止しました");
            }

        } catch (error) {
            document.getElementById('status').textContent = "エラーが発生しました: " + error.message;
            console.error(error);
        }
    </script>
</body>
</html>
